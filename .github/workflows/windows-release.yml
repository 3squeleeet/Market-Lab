name: Windows release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify executable and calculate checksum
        shell: pwsh
        run: |
          $file = Get-Item release/Market-Lab-0.1.0-Windows-x64.exe
          if ($file.Length -lt 1000000) { throw 'Executable is incomplete' }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Upload executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 release/Market-Lab-0.1.0-Windows-x64.exe release/SHA256SUMS.txt --clobber
          gh release edit v0.1.0 --draft=false --latest
